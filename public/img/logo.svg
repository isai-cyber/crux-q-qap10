<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="siriusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0F2D59" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Gear Silhouette -->
  <g fill="#0F2D59" opacity="0.95">
    <path d="M92 12h16l3 14 11 4 11-10 12 12-10 11 4 11 14 3v16l-14 3-4 11 10 11-12 12-11-10-11 4-3 14H92l-3-14-11-4-11 10-12-12 10-11-4-11-14-3V92l14-3 4-11-10-11 12-12 11 10 11-4z" />
  </g>

  <!-- Inner Circle Border -->
  <circle cx="100" cy="100" r="70" fill="#FFFFFF" stroke="#0284C7" stroke-width="4" />

  <!-- Circuit traces -->
  <g stroke="#0284C7" stroke-width="2.5" fill="none" opacity="0.8" stroke-linecap="round">
    <path d="M50 80h20l10-10h15" />
    <circle cx="50" cy="80" r="3" fill="#10B981" stroke="none" />
    <circle cx="95" cy="70" r="3" fill="#0284C7" stroke="none" />

    <path d="M150 80h-20l-10-10h-15" />
    <circle cx="150" cy="80" r="3" fill="#10B981" stroke="none" />
    <circle cx="105" cy="70" r="3" fill="#0284C7" stroke="none" />

    <path d="M50 120h20l10 10h15" />
    <circle cx="50" cy="120" r="3" fill="#10B981" stroke="none" />
    <circle cx="95" cy="130" r="3" fill="#0284C7" stroke="none" />

    <path d="M150 120h-20l-10 10h-15" />
    <circle cx="150" cy="120" r="3" fill="#10B981" stroke="none" />
    <circle cx="105" cy="130" r="3" fill="#0284C7" stroke="none" />
  </g>

  <!-- 8-Point Sirius Star Core -->
  <!-- Diagonal rays -->
  <polygon points="100,55 106,94 145,100 106,106 100,145 94,106 55,100 94,94" fill="url(#siriusGrad)" />
  <polygon points="100,68 104,96 132,100 104,104 100,132 96,104 68,100 96,96" fill="#38BDF8" opacity="0.7" transform="rotate(45 100 100)" />
  
  <!-- Main Star Sharp Points -->
  <polygon points="100,30 108,92 170,100 108,108 100,170 92,108 30,100 92,92" fill="url(#siriusGrad)" stroke="#FFFFFF" stroke-width="2" />
  
  <!-- Inner Center Flare -->
  <circle cx="100" cy="100" r="8" fill="#FFFFFF" filter="url(#glow)" />
  <polygon points="100,75 103,97 125,100 103,103 100,125 97,103 75,100 97,97" fill="#E0F2FE" />
</svg>
